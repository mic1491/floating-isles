<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>浮光群島</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
    <style>
      /* Inline on purpose: it must paint before any script has downloaded. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        color: #fff;
        font: 500 22px/1.3 system-ui, sans-serif;
        letter-spacing: 0.3em;
        background: linear-gradient(#2d3470, #e59a86);
        transition: opacity 0.6s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading small {
        font-size: 12px;
        letter-spacing: 0.1em;
        opacity: 0.8;
      }
      #loading i {
        width: 120px;
        height: 3px;
        margin: 0 auto;
        border-radius: 2px;
        background: rgb(255 255 255 / 25%);
        overflow: hidden;
      }
      #loading i::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #fff;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div id="loading">浮光群島<i></i><small>載入中…</small></div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
